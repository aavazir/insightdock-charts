name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18
      - name: clang-format --dry-run
        run: |
          find src include tests -type f \( -name '*.cc' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

  lint-tidy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-tidy
      - name: Configure
        run: |
          cmake -B build-tidy \
            -DINSIGHTDOCK_BUILD_TESTS=ON \
            -DINSIGHTDOCK_WERROR=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build core library
        run: cmake --build build-tidy -j"$(nproc)" --target InsightDockCharts
      - name: clang-tidy
        run: |
          status=0
          for f in src/*.cc; do
            clang-tidy -p build-tidy "$f" --quiet || status=1
          done
          exit $status

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build \
            -DINSIGHTDOCK_BUILD_EXAMPLES=ON \
            -DINSIGHTDOCK_BUILD_TESTS=ON \
            -DINSIGHTDOCK_WERROR=OFF
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build-san \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DINSIGHTDOCK_BUILD_TESTS=ON \
            -DINSIGHTDOCK_WERROR=OFF \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san -j"$(nproc)"
      - name: Test (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure
