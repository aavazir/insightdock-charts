name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18
      - name: clang-format --dry-run
        run: |
          find src include tests -type f -not -path 'tests/third_party/*' \( -name '*.cc' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

  lint-tidy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-tidy
      - name: Configure
        run: |
          cmake -B build-tidy \
            -DINSIGHTDOCK_BUILD_TESTS=ON \
            -DINSIGHTDOCK_WERROR=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build core library
        run: cmake --build build-tidy -j"$(nproc)" --target InsightDockCharts
      - name: clang-tidy
        run: |
          status=0
          for f in src/*.cc; do
            # PoDoFo sources need PoDoFo headers, which this job does not configure.
            case "$f" in src/podofo_*) continue;; esac
            clang-tidy -p build-tidy "$f" --quiet || status=1
          done
          exit $status

  build-and-test:
    # arm64 matters: float->int overflow saturates there (x86 yields INT_MIN), which is how
    # OpenWrt-class targets would behave on hostile data. Windows/macOS cover MSVC and Apple
    # clang; the shared-library entry exercises INSIGHTDOCK_API export and the find_package
    # consumer test (which installs and builds an out-of-tree program) against a shared build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, shared: OFF}
          - {os: ubuntu-latest, shared: ON}
          - {os: ubuntu-24.04-arm, shared: OFF}
          - {os: macos-latest, shared: OFF}
          - {os: windows-latest, shared: OFF}
          - {os: windows-latest, shared: ON}
    name: build-and-test (${{ matrix.os }}, shared=${{ matrix.shared }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build
          -DINSIGHTDOCK_BUILD_EXAMPLES=ON
          -DINSIGHTDOCK_BUILD_TESTS=ON
          -DINSIGHTDOCK_WERROR=OFF
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  version-consistency:
    # CMake, the OpenWrt package and the vcpkg port must declare the same version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_version.sh

  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned PoDoFo 1.2 source
        uses: actions/checkout@v4
        with:
          repository: podofo/podofo
          ref: 00f86c8ad7b78430b25ad2c81edb704ae8daa6ea
          path: build-dependencies/podofo
          submodules: recursive
          persist-credentials: false
      - name: Install PDF dependencies
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq
          libssl-dev libfreetype-dev libfontconfig1-dev libxml2-dev zlib1g-dev
          libjpeg-dev libpng-dev libtiff-dev
      - name: Build and install PoDoFo
        run: |
          cmake -S build-dependencies/podofo -B build-dependencies/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build-dependencies/install" \
            -DPODOFO_BUILD_LIB_ONLY=ON -DPODOFO_WITH_AFDKO=OFF
          cmake --build build-dependencies/build --parallel 2
          cmake --install build-dependencies/build
      - name: Build PDF-enabled InsightDock Charts
        run: |
          cmake -B build-pdf -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build-dependencies/install" \
            -DINSIGHTDOCK_WITH_PODOFO=ON -DINSIGHTDOCK_BUILD_TESTS=ON
          cmake --build build-pdf --parallel 2
      - name: Test PDF output and installed consumer
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build-dependencies/install/lib
        run: |
          ctest --test-dir build-pdf --output-on-failure
          ./build-pdf/podofo_report_example
          test -s chart_report.pdf
          test -s report_builder_example.pdf

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build-san \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DINSIGHTDOCK_BUILD_TESTS=ON \
            -DINSIGHTDOCK_WERROR=OFF \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined,float-cast-overflow,float-divide-by-zero -fno-sanitize-recover=undefined,float-cast-overflow -fno-omit-frame-pointer" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san -j"$(nproc)"
      - name: Test (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

  make-build:
    # The minimal Makefile build (OpenWrt / embedded) must stay in sync with CMake.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Default configuration (all chart types) + unit tests
        run: make -j"$(nproc)" test
      - name: Minimal configuration (pie only, PNG only, system font)
        run: |
          make clean
          make -j"$(nproc)" lib CHART_TYPES="pie" EXPORT_FORMATS="png" FONT_MODE=system
